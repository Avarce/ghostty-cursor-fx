<!doctype html>
<meta charset="utf-8">
<title>cjk harness</title>
<style>body { background: #111; color: #ccc; font: 13px monospace; margin: 8px; }</style>
<div id="log"></div>
<script>
// Like index.html, but the screen is drawn cell by cell like a terminal: CJK characters take two
// cells, centered; rows can be colored; the input box lines (4 px, like Ghostty's), the sent-prompt
// bars and the cursor are placed freely. Open as cjk.html?shader=../shaders/<file>&set={"NAME":"value"}
// (set overrides setting lines; bg= and fg= the theme's colors; opacity= a translucent window, where Ghostty
// hands over the background premultiplied; linear=0 an sRGB screen texture, as on macOS). window.render(time, change, { screen, prev, linear, focus }).
const W = 1200, H = 420, CH = 44, PADX = 16, PADY = 12;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const q = new URLSearchParams(location.search);
const BG = '#' + (q.get('bg') || '2a2a2a'), FG = '#' + (q.get('fg') || 'c6bba3'), CUR_TEXT = BG;
const CUR = '#' + (q.get('color') || '50e080');
const term = document.createElement('canvas'); term.width = W; term.height = H;
const tc = term.getContext('2d');
tc.font = '30px Menlo, monospace';
const CW = Math.round(tc.measureText('M').width);
const wide = ch => /[ᄀ-ᅟ⺀-꓏가-힣豈-﫿︰-﹏＀-｠￠-￦]/.test(ch);
// rows: [{ text, color }] or strings; box: [topRow, bottomRow] draws full-width lines in those rows;
// bar: row(s) on a background (Claude Code's grey sent-prompt bar unless given); cur: { row, col, wide, hidden }; curH: the cursor's
// height, centered in its row (Ghostty's rows are taller than the cursor with adjust-cell-height).
// pane: [firstCol, endCol] the columns the box lines span, with other text left and right of it (a sidebar,
// a split); short: { row, from, to } a short line in a row (an underline).
let CURH = CH;
function drawTerm({ rows = [], box = null, cur = { row: 6, col: 2 }, bar = null, lineW = 4, curH = CH, pane = null, short = null } = {}) {
  CURH = curH;
  tc.fillStyle = BG; tc.fillRect(0, 0, W, H);
  tc.textBaseline = 'top';
  for (const b of [].concat(bar ?? [])) {  // a row number (Claude Code's #373737), or { row, color }
    tc.fillStyle = b.color || '#373737'; tc.fillRect(PADX, PADY + (b.row ?? b) * CH, W - 2 * PADX, CH);
  }
  const boxL = pane ? PADX + pane[0] * CW : PADX, boxR = pane ? PADX + pane[1] * CW : W - PADX;
  if (box) { tc.fillStyle = '#6a6a6a'; for (const r of box) tc.fillRect(boxL, PADY + r * CH + CH / 2 - lineW / 2, boxR - boxL, lineW); }
  if (short) { tc.fillStyle = '#6a6a6a'; tc.fillRect(PADX + short.from * CW, PADY + short.row * CH + CH / 2 - lineW / 2, (short.to - short.from) * CW, lineW); }
  if (pane) {
    tc.fillStyle = FG; tc.font = '30px Menlo, monospace';
    for (let r = 0; r < 9; r++) {
      if (pane[0] > 2) tc.fillText('agent'.slice(0, pane[0] - 2), PADX, PADY + r * CH + 6);
      if (boxR < W - PADX - 3 * CW) tc.fillText('other', boxR + CW, PADY + r * CH + 6);
    }
  }
  rows.forEach((row, r) => {
    const { text, color = FG } = typeof row === 'string' ? { text: row } : row;
    let col = 0;
    for (const ch of text) {
      const w = wide(ch) ? 2 : 1;
      tc.fillStyle = color;
      tc.font = w === 2 ? '30px "PingFang SC", "Hiragino Sans GB", sans-serif' : '30px Menlo, monospace';
      const m = tc.measureText(ch).width;
      tc.fillText(ch, PADX + col * CW + (w * CW - m) / 2, PADY + r * CH + 6);
      col += w;
    }
  });
  if (!cur.hidden) { tc.fillStyle = CUR; tc.fillRect(PADX + cur.col * CW, PADY + cur.row * CH + (CH - curH) / 2, (cur.wide ? 2 : 1) * CW, curH); }
}
const rect = (row, col, w = 1) => [PADX + col * CW, H - (PADY + row * CH + (CH - CURH) / 2), w * CW, CURH];

const gl = document.createElement('canvas').getContext('webgl2', { preserveDrawingBuffer: true });
gl.canvas.width = W; gl.canvas.height = H; gl.viewport(0, 0, W, H);
const log = m => document.getElementById('log').insertAdjacentHTML('beforeend', `<div>${m}</div>`);
const PRELUDE = `#version 300 es
precision highp float; precision highp int;
uniform vec3 iResolution; uniform float iTime;
uniform vec4 iCurrentCursor; uniform vec4 iPreviousCursor;
uniform vec4 iCurrentCursorColor; uniform vec4 iPreviousCursorColor;
uniform int iCurrentCursorStyle; uniform int iCursorVisible;
uniform float iTimeCursorChange; uniform int iFocus;
uniform vec3 iPalette[16];
uniform vec3 iBackgroundColor; uniform vec3 iForegroundColor; uniform vec3 iCursorText;
#define CURSORSTYLE_BLOCK 0
uniform sampler2D iChannel0;
uniform int uLinear;
out vec4 _fragColor;
vec4 texLin(sampler2D s, vec2 uv) { vec4 c = texture(s, uv); return uLinear == 1 ? vec4(pow(c.rgb, vec3(2.2)), c.a) : c; }
#define texture texLin
`;
const POST = `
void main() { vec4 c; mainImage(c, gl_FragCoord.xy);
  _fragColor = vec4(uLinear == 1 ? pow(c.rgb, vec3(1.0 / 2.2)) : c.rgb, 1.0); }
`;
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
window.ready = fetch(q.get('shader'), { cache: 'no-store' }).then(r => r.text()).then(body => {
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, `#version 300 es
in vec2 pos; void main() { gl_Position = vec4(pos, 0.0, 1.0); }`));
  body = body.replace(/^#define Y_DOWN .*$/m, '#define Y_DOWN false');
  for (const [k, v] of Object.entries(JSON.parse(q.get('set') || '{}')))
    body = body.replace(new RegExp(`^(const\\s+\\w+\\s+${k}\\s*=\\s*)[^;]+;`, 'm'), `$1${v};`);
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, PRELUDE + body + POST));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'pos');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  const u = n => gl.getUniformLocation(prog, n);
  gl.uniform3f(u('iResolution'), W, H, 1);
  gl.uniform3f(u('iBackgroundColor'), ...hex(BG));
  gl.uniform3f(u('iForegroundColor'), ...hex(FG));
  gl.uniform3f(u('iCursorText'), ...hex(CUR_TEXT));
  gl.uniform1i(u('iCurrentCursorStyle'), 0);
  const pal = new Float32Array(48); pal.set(hex('#d69de7'), 13 * 3); pal.set(hex('#6eceda'), 14 * 3);
  gl.uniform3fv(u('iPalette'), pal);
  gl.uniform1i(u('iChannel0'), 0);
  // screen: drawTerm options; prev: { row, col, wide } of the previous cursor.
  const OPACITY = +(q.get('opacity') || 1), LINEAR = q.get('linear') === '0' ? 0 : 1;
  // The screen as the shader gets it, top row first (the background premultiplied, its alpha below 1).
  window.screenData = () => {
    const d = new Uint8ClampedArray(tc.getImageData(0, 0, W, H).data), b = hex(BG).map(v => Math.round(v * 255));
    if (OPACITY < 1) for (let i = 0; i < d.length; i += 4) if (d[i] === b[0] && d[i + 1] === b[1] && d[i + 2] === b[2]) {
      for (let k = 0; k < 3; k++) d[i + k] = Math.round(d[i + k] * OPACITY);
      d[i + 3] = Math.round(255 * OPACITY);
    }
    return d;
  };
  window.render = (time, change, { screen = {}, prev = null, linear = LINEAR, focus = 1, signal = null } = {}) => {
    const cur = screen.cur || { row: 6, col: 2 };
    drawTerm(screen);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(screenData().buffer));
    const p = prev || cur;
    gl.uniform4f(u('iCurrentCursor'), ...rect(cur.row, cur.col, cur.wide ? 2 : 1));
    gl.uniform4f(u('iPreviousCursor'), ...rect(p.row, p.col, p.wide ? 2 : 1));
    const c = hex(CUR);  // the signals: the lowest bit of the blue (Enter) or green (done) value
    if (signal === 'enter') c[2] = (Math.round(c[2] * 255) | 1) / 255;
    if (signal === 'done') c[1] = (Math.round(c[1] * 255) | 1) / 255;
    gl.uniform4f(u('iCurrentCursorColor'), ...c, 1);
    gl.uniform4f(u('iPreviousCursorColor'), ...hex(CUR), 1);
    gl.uniform1i(u('iCursorVisible'), 1); gl.uniform1i(u('iFocus'), focus);
    gl.uniform1i(u('uLinear'), linear);
    gl.uniform1f(u('iTime'), time); gl.uniform1f(u('iTimeCursorChange'), change);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const px = new Uint8Array(W * H * 4);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return px;
  };
  // Changed pixels between two renders, per screen row and per cell column of a row.
  window.diffRows = (a, b) => {
    const rows = {}; let n = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]) > 3) {
        n++; const r = Math.floor((H - 1 - y - PADY) / CH); rows[r] = (rows[r] || 0) + 1;
      }
    }
    return { n, rows };
  };
  window.diffCells = (a, b, row) => {
    const cols = {};
    for (let y = H - (PADY + (row + 1) * CH); y < H - (PADY + row * CH); y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]) > 3) {
        const c = Math.floor((x - PADX) / CW); cols[c] = (cols[c] || 0) + 1;
      }
    }
    return cols;
  };
  // Mean color of the pixels in a cell that are far from the background (its letter), as hex.
  window.inkColor = (px, row, col, w = 1) => {
    let s = [0, 0, 0], n = 0; const bg = hex(BG).map(v => v * 255);
    for (let y = H - (PADY + (row + 1) * CH); y < H - (PADY + row * CH); y++) for (let x = PADX + col * CW; x < PADX + (col + w) * CW; x++) {
      const i = (y * W + x) * 4;
      if (Math.abs(px[i] - bg[0]) + Math.abs(px[i + 1] - bg[1]) + Math.abs(px[i + 2] - bg[2]) > 150) { s[0] += px[i]; s[1] += px[i + 1]; s[2] += px[i + 2]; n++; }
    }
    return n ? '#' + s.map(v => Math.round(v / n).toString(16).padStart(2, '0')).join('') + ` (${n}px)` : 'none';
  };
  // A region of the last render, scaled up, as a PNG data URL (for looking at it).
  window.crop = (x, yTop, w, h, scale = 3) => {
    const c = document.createElement('canvas'); c.width = w * scale; c.height = h * scale;
    const cx = c.getContext('2d'); cx.imageSmoothingEnabled = false;
    cx.drawImage(gl.canvas, x, yTop, w, h, 0, 0, w * scale, h * scale);
    return c.toDataURL('image/png');
  };
  window.CW = CW; window.drawTerm = drawTerm; window.term = term; window.W = W; window.H = H; window.PADX = PADX; window.PADY = PADY; window.CH = CH;
  log(`compiled OK; cell ${CW}x${CH}px`);
}).catch(e => { log('ERROR: ' + e.message); window.failed = e.message; });
// run=detection.js: run a check file after compiling and write its result into the page.
if (q.get('run')) window.ready.then(async () => {
  const out = window.failed ? { failed: window.failed } : await (0, eval)(await (await fetch(q.get('run'), { cache: 'no-store' })).text());
  log('RESULT ' + JSON.stringify(out));
}).catch(e => log('RESULT ' + JSON.stringify({ failed: String(e) })));
</script>
