<!doctype html>
<meta charset="utf-8">
<title>Cursor FX promo stage</title>
<style>
  @font-face { font-family: "Inter"; src: url(fonts/Inter-latin.woff2) format("woff2"); font-weight: 100 900; }
  body { background: #000; margin: 0; color: #ccc; font: 13px monospace; }
  canvas { display: block; max-width: 100vw; }
</style>
<canvas id="out"></canvas>
<div id="log"></div>
<script type="module">
// Open index.html?t=<seconds> (or ?cut=trio&t=..., ?cut=showcase&t=...) to look at one moment. render.mjs drives renderAt / pushFrame.
import { FX } from './js/fx.js';
import { EFFECTS } from './js/effects.js';
import { SHOTS, init, W, H, fadeAlpha, DURATION, PANEL, drawCard, drawLoop } from './js/scenes.js';
import { FPS } from './js/timeline.js';

const q = new URLSearchParams(location.search);
const CUT = q.get('cut') || 'main';
const out = document.getElementById('out');
out.width = W; out.height = H;
const c = out.getContext('2d');
const log = m => document.getElementById('log').insertAdjacentHTML('beforeend', `<div>${m}</div>`);

// Panel footage: capture/panel/NNNN.jpg at 60 fps (made by capture-panel.mjs); a placeholder if missing.
const panel = [];
async function loadPanel() {
  const n = Math.ceil((PANEL.t1 - PANEL.t0) * FPS) + 2;
  for (let i = 0; i < n; i++) {
    const img = new Image(); img.src = `capture/panel/${String(i).padStart(4, '0')}.jpg`;
    try { await img.decode(); panel.push(img); } catch { break; }
  }
  log(`panel frames: ${panel.length}`);
}
const panelFrame = lt => panel.length ? panel[Math.min(panel.length - 1, Math.max(0, Math.round(lt * FPS)))] : null;

window.ready = (async () => {
  await document.fonts.load('600 40px Inter');
  await document.fonts.load('40px "TX-02 Retina SemiCondensed"');
  const fx = new FX();
  for (const n of Object.keys(EFFECTS)) await fx.load(n, '../shaders/' + EFFECTS[n].file);
  init(fx);
  if (CUT !== 'main') {
    // 3840x2160 (trio, showcase): two composites (for transitions) and the post pass, whose canvas is the output.
    const T = await import(`./js/${CUT}.js`);
    const { Post } = await import('./js/post.js');
    const mk = () => { const k = document.createElement('canvas'); k.width = T.W; k.height = T.H; return k; };
    const ca = mk(), cb = mk(), post = new Post(T.W, T.H);
    out.replaceWith(post.canvas);
    // beforeFrame (showcase): loads what a frame needs first, e.g. one 4K panel frame at a time.
    window.renderAt = async t => { if (T.beforeFrame) await T.beforeFrame(t); const f = T.frame(t, ca, cb); post.draw(f.a, f.b, f.post); };
    window.grab = (type = 'image/png', qq) => post.canvas.toDataURL(type, qq);
    // A lossless PNG per frame, POSTed to render.mjs (much faster than sending raw RGBA).
    window.pushFrame = async (t, i) => {
      await window.renderAt(t);
      const png = await new Promise(r => post.canvas.toBlob(r, 'image/png'));
      for (let k = 0; ; k++) {   // render.mjs ignores a repeat of a frame it already has
        try {
          const r = await fetch('/frame?i=' + i, { method: 'POST', body: png });
          if (r.ok) { if (i % 20 === 0 && window.gc) window.gc(); return; }   // let finished frames go (Chrome ran out of blob memory once)
          throw new Error('frame ' + i + ' refused: ' + r.status);
        }
        catch (e) { if (k >= 3) throw e; await new Promise(r => setTimeout(r, 500)); }
      }
    };
    window.FRAMES = Math.round(T.DURATION * FPS);
    window.SIZE = [T.W, T.H];
  } else {
    await loadPanel();
    window.FRAMES = Math.round(DURATION * FPS);
    window.SIZE = [W, H];
  }
  log(`ready: ${CUT}, ${Object.keys(EFFECTS).length} shaders, ${window.FRAMES} frames, TX-02 ${document.fonts.check('40px "TX-02 Retina SemiCondensed"')}`);
})().catch(e => { log('ERROR ' + e.message); window.failed = e.message; });

window.renderAt = t => {
  const shot = SHOTS.find(s => t >= s.t0 && t < s.t1) || SHOTS[SHOTS.length - 1];
  c.save(); shot.draw(c, t, panelFrame); c.restore();
  const a = fadeAlpha(t);
  if (a < 1) { c.fillStyle = `rgba(0,0,0,${1 - a})`; c.fillRect(0, 0, W, H); }
};
window.renderFrame = i => window.renderAt(i / FPS);
window.grab = (type = 'image/png', qq) => out.toDataURL(type, qq);
window.renderCard = (name, since) => drawCard(c, name, since);
window.renderLoop = t => drawLoop(c, t);

if (q.has('t')) window.ready.then(() => window.renderAt(+q.get('t')));
</script>
